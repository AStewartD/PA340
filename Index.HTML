<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Notes</title>
    <link rel='stylesheet' href='style.css'>
</head>

<body>
    <form id="noteForm">

        <div class="container">
            <div id="errorBanner" class="hidden"></div>
            <div id="successBanner" class="hidden"></div>

            <div class="titleRow">
                <h1>Notes</h1>
                <img class="titleNoteIcon" src="Images/CuteNote.png" alt="Cute note" loading="lazy">
            </div>
            <p>Filter through notes, stories, and other documents.</p>

            <div class="buttonRow">
                <a class="btn" href="insert.html">Go to Insert Page</a>
            </div>

            <div class='row'>
                <div class='col-12'>
                    <label for='title'>Title:</label><br>
                    <input type='text' id='title' name='title'><br><br>
                    <div id="titleError" class="error"></div>
                </div>

                <!-- <div class='row'>
            <div class='col-2'>
                <label>First Name</label>
            </div>
            <div class='col-10'>
                <input id='firstName' type='text' />
            </div>
        </div> -->

            </div>

            <div class='row'>
                <div class='col-12'>
                    <label for='docType'>Doc Type:</label>
                </div>
                <div class='col-12'>
                    <input type='text' id='docType' name='docType'><br><br>
                    <div id="docTypeError" class="error"></div>
                </div>
            </div>

            <div class='row'>
                <div class='col-12'>
                    <label for='category'>Category:</label>
                </div>
                <div class='col-12'>
                    <select id='category' name='category'>
                        <option value=''>All categories</option>
                    </select><br><br>
                    <div id="categoryError" class="error"></div>
                </div>
            </div>

            <div class='row'>
                <div class='col-2'>
                    <label>Tags</label>
                </div>
                <div class='col-10'>
                    <select id='tagsPicker' name='tagsPicker'>
                        <option value=''>Select a tag...</option>
                    </select>
                    <div id='selectedTags' class='selectedTags'></div>
                    <select id='tags' name='tags' multiple class='hidden'></select>
                    <div id="tagsError" class="error"></div>
                </div>
            </div>

            <div class='row'>
                <div class='col-12'>
                    <label for='pageCount'>Page Count:</label>
                </div>
                <input type='text' id='pageCount' name='pageCount'><br><br>
                <div id="pageCountError" class="error"></div>
            </div>

            <div class='row'>
                <div class='col-12'>
                    <label for='date'>Date Created:</label>
                </div>
                <div class='col-12'>
                    <input type='date' id='date' name='date'><br><br>
                    <div id="dateError" class="error"></div>
                </div>

                <div class='col-12'>
                    <label for='limit'>Limit:</label>
                </div>
                <div class='col-12'>
                    <input type='number' id='limit' name='limit' min='1' max='100' value='100'><br><br>
                    <div id="limitError" class="error"></div>
                </div>

                <div class='col-12'>
                    <label for='sortBy'>Sort By:</label>
                </div>
                <div class='col-12'>
                    <select id='sortBy' name='sortBy'>
                        <option value='title'>Title</option>
                        <option value='docType'>Doc Type</option>
                        <option value='category'>Category</option>
                        <option value='date'>Date Created</option>
                    </select><br><br>
                </div>

                <div class='col-12'>
                    <label for='sortDirection'>Sort Direction:</label>
                </div>
                <div class='col-12'>
                    <select id='sortDirection' name='sortDirection'>
                        <option value='DESC'>Descending</option>
                        <option value='ASC'>Ascending</option>
                    </select><br><br>
                </div>

                <div class="buttonRow">
                    <input id="submitButton" type="submit" value="Apply Filters">
                </div>


            </div>
    </form>

    <section class="container">
        <h2>Filtered Results</h2>
        <div id="resultsMessage"></div>
        <div class="tableWrap">
            <table id="resultsTable" border="1" cellspacing="0" cellpadding="6">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Doc Type</th>
                        <th>Category</th>
                        <th>Tags</th>
                        <th>Date Created</th>
                        <th>Edit</th>
                        <th>Open</th>
                        <th>File</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
    </section>

    <div id="noteModal" class="modal hidden" aria-hidden="true">
        <div class="modalCard">
            <div class="modalHeader">
                <h2 id="modalTitle">Note</h2>
                <button id="closeModalButton" type="button">Close</button>
            </div>
            <div class="modalMeta" id="modalMeta"></div>
            <div class="modalBody" id="modalBody"></div>
        </div>
    </div>

    <script src='app.js'></script>
</body>

</html>
